name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and run engine tests
        run: make test
      - name: Build renderer and benchmark
        run: make reed && ./build/reed bench
      - name: Render smoke test
        run: ./build/reed note --note 60 --vel 100 --seconds 1 --out /tmp/reed.wav

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build the emulator engine
        run: ./web/build.sh
      - name: Node smoke test
        run: node web/test_wasm.mjs
